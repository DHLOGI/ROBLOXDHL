<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHL Roblox Group</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/pdjV9tDM/6111-removebg-preview.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* [ ... TUS ESTILOS ORIGINALES SE MANTIENEN IGUAL ... ] */
        /* Agrega estos nuevos estilos al final de tu etiqueta <style> */

        .ai-bot-btn { position: fixed; bottom: 25px; right: 25px; width: 75px; height: 75px; background-color: #E8B63E; border: 4px solid #ad1b45; border-radius: 50%; cursor: pointer; z-index: 1500; display: flex; justify-content: center; align-items: center; }
        .ai-bot-btn img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

        .ai-chat-fullscreen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; 
            display: none; flex-direction: column; 
        }
        .ai-chat-fullscreen.show { display: flex; }
        .chat-header-fs { background: #E8B63E; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #ad1b45; }
        .chat-body-fs { flex: 1; padding: 20px; background: #f1f1f1; overflow-y: auto; }
        .chat-input-fs { padding: 20px; border-top: 1px solid #ccc; display: flex; gap: 10px; background: white; }
        .chat-input-fs input { flex: 1; padding: 15px; border: 1px solid #ccc; border-radius: 30px; }
        .send-btn { background: none; border: none; font-size: 24px; color: #ad1b45; cursor: pointer; }
        
        .settings-panel { padding: 20px; }
        .setting-opt { padding: 15px; border-bottom: 1px solid #ddd; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body id="top">

    <!-- [ ... TU HEADER Y MAIN SE MANTIENEN IGUAL ... ] -->

    <!-- BOTÓN IA -->
    <button id="ai-bot-btn" class="ai-bot-btn" onclick="toggleFullscreenChat()">
        <img src="https://i.postimg.cc/LXxgQc7w/upscalemedia-transformed.png" alt="Aida">
    </button>

    <!-- CHAT PANTALLA COMPLETA -->
    <div id="ai-chat-fs" class="ai-chat-fullscreen">
        <div class="chat-header-fs">
            <h2 style="color: #ad1b45;">Aida</h2>
            <div>
                <button onclick="toggleSettings()" style="background:none; border:none; font-size:24px; cursor:pointer;"><i class="fa-solid fa-gear" style="color:black;"></i></button>
                <button onclick="toggleFullscreenChat()" style="background:none; border:none; font-size:24px; cursor:pointer; margin-left:15px;"><i class="fa-solid fa-times"></i></button>
            </div>
        </div>
        <div id="fs-chat-content" class="chat-body-fs">
            <div id="fs-messages">
                <div style="background:white; padding:15px; border-radius:10px;">Hello! I'm Aida, the DHL Group Virtual Assistant. I'm here to help you with any queries!</div>
            </div>
        </div>
        <div class="chat-input-fs">
            <input type="text" placeholder="Type your message...">
            <button class="send-btn"><i class="fa-solid fa-arrow-up"></i></button>
        </div>
    </div>

    <!-- MODAL "ARE YOU SURE?" -->
    <div id="confirm-modal" class="modal-overlay" style="display:none; z-index: 10000;">
        <div class="modal-content">
            <h2>Are you sure?</h2>
            <p>This will delete your current conversation.</p>
            <button onclick="resetChat()">Yes</button>
            <button onclick="document.getElementById('confirm-modal').style.display='none'">No</button>
        </div>
    </div>

    <!-- [ ... TUS SCRIPTS ORIGINALES ABAJO ... ] -->
    <script>
        let isSettings = false;
        let savedMessages = '';

        function toggleFullscreenChat() {
            document.getElementById('ai-chat-fs').classList.toggle('show');
        }

        function toggleSettings() {
            const content = document.getElementById('fs-chat-content');
            isSettings = !isSettings;
            if (isSettings) {
                savedMessages = content.innerHTML;
                content.innerHTML = `<div class="settings-panel">
                    <div class="setting-opt">Dark mode on/off</div>
                    <div class="setting-opt" onclick="document.getElementById('confirm-modal').style.display='flex'">Reset chat</div>
                </div>`;
            } else {
                content.innerHTML = savedMessages;
            }
        }

        function resetChat() {
            document.getElementById('fs-messages').innerHTML = '';
            document.getElementById('confirm-modal').style.display = 'none';
            toggleSettings(); // Cierra configuracion y vuelve al chat vacío
        }
    </script>
</body>
</html>
