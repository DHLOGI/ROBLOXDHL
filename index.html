<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHL Roblox Group</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/pdjV9tDM/6111-removebg-preview.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- ESTILOS GENERALES (Tu sitio original) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        header { background-color: #E8B63E; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; height: 90px; position: sticky; top: 0; z-index: 500; }
        .hero { height: calc(100vh - 90px); background-image: url('https://i.postimg.cc/d3K5qJnp/Diseno-sin-titulo-(1).png'); background-size: cover; background-position: center; }
        .content-section { padding: 80px 40px; background-color: #f9f9f9; }
        
        /* --- BOTÓN FLOTANTE --- */
        .ai-bot-btn { position: fixed; bottom: 25px; right: 25px; width: 75px; height: 75px; background-color: #E8B63E; border: 4px solid #ad1b45; border-radius: 50%; cursor: pointer; z-index: 1500; }
        .ai-bot-btn img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        /* --- CHAT FULL SCREEN --- */
        .ai-chat-window { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
            background-color: #ffffff; z-index: 9999; display: none; flex-direction: column; 
        }
        .ai-chat-window.show { display: flex; }
        .chat-header { background-color: #E8B63E; color: #ad1b45; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #ad1b45; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-actions button { background: none; border: none; font-size: 24px; color: #000; cursor: pointer; margin-left: 15px; }
        
        .chat-body { flex: 1; padding: 20px; background-color: #f1f1f1; overflow-y: auto; }
        .chat-input-container { padding: 15px; border-top: 1px solid #ccc; display: flex; gap: 10px; background: white; }
        .chat-input-container input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 30px; }
        .chat-voice-btn { background: none; border: none; font-size: 20px; color: #ad1b45; cursor: pointer; }

        /* --- CONFIGURACIÓN Y MODALES --- */
        .settings-panel { padding: 40px; }
        .settings-option { padding: 20px; background: white; margin-bottom: 10px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; border: 2px solid #ad1b45; font-weight: bold; color: #ad1b45; }
        .modal-overlay { position: fixed; top:0; left:0; width: 100%; height:100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 10000; }
        .modal-box { background: #E8B63E; border: 4px solid #ad1b45; padding: 30px; border-radius: 12px; text-align: center; color: #ad1b45; }
        .modal-btn { background: transparent; border: 2px solid #ad1b45; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; margin: 10px; }
    </style>
</head>
<body>

    <header>
        <a href="#top" class="logo-container"><img src="https://i.postimg.cc/pdjV9tDM/6111-removebg-preview.png" alt="Logo" style="height: 100px;"></a>
        <nav style="display: flex; gap: 20px; color: white; font-weight: bold;">
            <a href="#about" style="color:white; text-decoration:none;">About us</a>
            <a href="#fleet" style="color:white; text-decoration:none;">Fleet</a>
        </nav>
    </header>

    <main>
        <section class="hero"></section>
        <section id="about" class="content-section"><h2>About Us Content</h2></section>
    </main>

    <!-- BOTÓN IA -->
    <button id="ai-bot-btn" class="ai-bot-btn" onclick="toggleChat()">
        <img src="https://i.postimg.cc/LXxgQc7w/upscalemedia-transformed.png" alt="Aida">
    </button>

    <!-- VENTANA CHAT -->
    <div id="ai-chat-window" class="ai-chat-window">
        <div class="chat-header">
            <div class="header-left">
                <img src="https://i.postimg.cc/LXxgQc7w/upscalemedia-transformed.png" style="width: 30px; border-radius: 50%;">
                <h2>Aida</h2>
            </div>
            <div class="header-actions">
                <button onclick="toggleSettings()"><i class="fa-solid fa-gear" style="color: black;"></i></button>
                <button onclick="toggleChat()"><i class="fa-solid fa-times"></i></button>
            </div>
        </div>

        <div id="chat-content" class="chat-body">
            <div id="messages-container">
                <div style="background:white; padding:15px; border-radius:10px; max-width: 80%;">Hello! I'm Aida, the DHL Group Virtual Assistant. I'm here to help you with any queries!</div>
            </div>
        </div>

        <div class="chat-input-container">
            <input type="text" placeholder="Type message...">
            <button class="chat-voice-btn"><i class="fa-solid fa-arrow-up"></i></button>
        </div>
    </div>

    <!-- MODAL RESET -->
    <div id="reset-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>Are you sure?</h2>
            <p>This will delete your current conversation.</p>
            <button class="modal-btn" onclick="confirmReset()">Yes</button>
            <button class="modal-btn" onclick="document.getElementById('reset-modal').style.display='none'">No</button>
        </div>
    </div>

    <script>
        let settingsOpen = false;
        let lastChatContent = '';

        function toggleChat() {
            document.getElementById('ai-chat-window').classList.toggle('show');
        }

        function toggleSettings() {
            const body = document.getElementById('chat-content');
            settingsOpen = !settingsOpen;
            
            if (settingsOpen) {
                lastChatContent = body.innerHTML; // Guardar estado
                body.innerHTML = `
                    <div class="settings-panel">
                        <div class="settings-option">Dark Mode <span>OFF</span></div>
                        <div class="settings-option" onclick="showResetModal()">Reset Chat</div>
                    </div>`;
            } else {
                body.innerHTML = lastChatContent; // Restaurar estado
            }
        }

        function showResetModal() {
            document.getElementById('reset-modal').style.display = 'flex';
        }

        function confirmReset() {
            document.getElementById('messages-container').innerHTML = '';
            document.getElementById('reset-modal').style.display = 'none';
            toggleSettings(); // Cierra el menú de configuración y vuelve al chat
        }
    </script>
</body>
</html>
